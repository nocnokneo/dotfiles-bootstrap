<h1>dotfiles-bootstrap</h1>
<p>Public entry point to a private dotfiles repo. Run this on a new machine:</p>
<pre><code>sh -c "$(curl -fsSL https://nocnokneo.github.io/dotfiles-bootstrap/install.sh)"</code></pre>
<p>
  Not <code>curl … | sh</code> &mdash; piping leaves <code>gh auth login</code> no terminal to prompt on.
</p>
